name: CI

# The test suite deliberately requires no downloaded data: it runs the project's
# real SQL against the committed synthetic fixture in tests/fixtures/. The full
# analysis needs ~245 MB from the City's portal and is not run here.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite against the synthetic fixture
        run: python -m pytest -q

      - name: Confirm the fixture reproduces the committed CSVs
        run: |
          python tests/fixtures/make_fixture.py
          git diff --exit-code -- tests/fixtures/

  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm no raw source data is committed
        run: |
          set -e
          if git ls-files 'data/raw/*' | grep -v '.gitkeep' | grep -q .; then
            echo "Raw source data is committed. It must stay git-ignored."
            git ls-files 'data/raw/*'
            exit 1
          fi
          echo "OK: data/raw/ contains only .gitkeep"

      - name: Confirm suppressed fields do not appear in committed outputs
        run: python -m pytest tests/test_privacy.py -q

      - name: Confirm every internal documentation link resolves
        run: python -m pytest tests/test_artifacts.py -q -k link

      - name: Verify written figures against committed aggregates
        run: |
          if [ -f data/aggregates/agg_executive_kpis.csv ]; then
            python scripts/verify_claims.py
          else
            echo "Aggregates not committed; skipping figure verification."
          fi
